<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}股票系統{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fce4ec;
        }
    </style>
</head>
<body>

<!-- 導覽列 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">股票系統</a>
        <div class="d-flex align-items-center ms-auto">
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="me-2">
                    <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png"
                         alt="頭像"
                         class="rounded-circle"
                         width="30" height="30"
                         style="vertical-align: middle; transform: translateY(1px);">
                </a>
                <span class="text-white me-2">歡迎，{{ user.username }}</span>
                <a class="btn btn-outline-light" href="{% url 'logout' %}">登出</a>
            {% else %}
                <a class="btn btn-outline-light me-2" href="{% url 'login' %}">登入</a>
                <a class="btn btn-outline-light" href="{% url 'register' %}">註冊</a>
            {% endif %}
        </div>
    </div>
</nav>

<!-- 搜尋欄 -->
<div class="container mt-4">
    <form class="input-group mb-3" method="GET" action="/search">
        <input type="text" class="form-control" name="query" placeholder="搜尋股票名稱或代碼，例如3008" required>
        <button class="btn btn-outline-secondary" type="submit">搜尋</button>
    </form>

    <!-- 頁面導覽按鈕 -->
    <div class="btn-group w-100 mb-4">
        <a href="/" class="btn btn-secondary">首頁</a>
        <a href="/watchlist" class="btn btn-secondary">自選股</a>
        <a href="/news" class="btn btn-secondary">新聞</a>
        <a href="/forum" class="btn btn-secondary">討論</a>
    </div>

    <!-- 主內容 -->
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</body>
</html>
